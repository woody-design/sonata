# electron-builder — Sonata packaging.
#
# M1 (WS1 S1): produce a Developer-ID-signed, hardened-runtime, arm64
# `Sonata.app`. `npm run package` builds the fast `dir` target below and stays
# NOT-notarized — that is the daily-driver path (a locally built app carries no
# quarantine xattr, so Gatekeeper never gates it).
#
# M2 (WS1 S3): `app/scripts/release.sh` reuses THIS config but overrides the mac
# target on the CLI (`--mac dmg zip --arm64`) to emit the Gatekeeper-clean
# distribution artifacts (notarized+stapled DMG, ZIP, latest-mac.yml), then
# notarizes and staples via `xcrun notarytool`/`stapler`. The build itself is
# not forked — release.sh adds targets + notarization on top of the same config,
# so the packaged app is behaviourally identical to the `npm run package` output.
#
# `npm run build` must run first (this config packages the compiled `dist/`).

appId: app.sonatacode.sonata
productName: Sonata

directories:
  # `build/` is .gitignored (collides with electron-builder's default resources
  # dir name), so resources live in `build-resources/` (holds icon.icns; S3 adds
  # entitlements plists here). `dist/` is the tsc/vite output, so packaged
  # artifacts go to `release/` to avoid clobbering it.
  buildResources: build-resources
  output: release

files:
  - dist/**/*
  - package.json
  # Production dependencies (node-pty) are collected automatically by
  # electron-builder; dev dependencies are excluded.

asar: true

# Tahoe (macOS 26) Liquid-Glass icon. Runs after packing, before signing, so the
# signature seals the added Assets.car. It compiles build-resources/Sonata.icon
# (Icon Composer package) via actool and wires CFBundleIconName, while `mac.icon`
# below keeps our hand-built legacy icon.icns for CFBundleIconFile (pre-Tahoe).
# Needs full Xcode 26+. Escape hatch: SONATA_SKIP_TAHOE_ICON=1 → icns-only.
afterPack: build-resources/after-pack.js

asarUnpack:
  # The provider CLIs spawn SYSTEM `node` to run these sink scripts, and external
  # `node` cannot read inside app.asar — so they must live on real disk. Their
  # command paths are built via `path.join(__dirname, ...)`; with the scripts
  # unpacked, __dirname resolves to app.asar.unpacked/... (verified against a
  # packaged run). Both sink chains are self-contained within these two dirs.
  - dist/runtime/cli-signal/**
  - dist/runtime/usage/**
  # node-pty ships a plain `spawn-helper` executable (not a `.node`), which
  # electron-builder does NOT auto-detect for unpacking. Unpack the whole module
  # so both `pty.node` and `spawn-helper` (with its exec bit) run from disk.
  - node_modules/node-pty/**

mac:
  category: public.app-category.developer-tools
  icon: build-resources/icon.icns
  # `npm run package` builds this fast `dir` target (no DMG/ZIP compression) —
  # the daily-driver path. The release path (release.sh) overrides this on the
  # CLI with `--mac dmg zip --arm64` to emit distribution artifacts; the config
  # stays `dir` so the common `npm run package` invocation is never slowed down.
  target:
    - target: dir
      arch: arm64
  # Hardened runtime is required for launch and for M2 notarization. S3 promoted
  # the entitlements from electron-builder's built-in default to explicit,
  # committed plists (below) so the set is inspectable and version-controlled.
  # The two files reproduce, verbatim, the three keys electron-builder 26 signed
  # by default in S1 (allow-jit + allow-unsigned-executable-memory +
  # disable-library-validation) — verified against the S1 signed build — so the
  # packaged app behaves identically. See each plist's header for per-key intent.
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  # Pin the exact Developer ID so a rebuild always re-signs with the same cert
  # (TCC grants survive). Never ad-hoc/adhoc sign. electron-builder 26 wants the
  # common name WITHOUT the "Developer ID Application:" type prefix and selects
  # the Developer ID cert automatically.
  identity: "Yuhui Li (NW3373QK97)"
  # Do NOT run Gatekeeper assessment (spctl) at build time — the app itself is
  # signed but not notarized until release.sh submits the DMG; assessment would
  # fail here. release.sh runs spctl explicitly after stapling instead.
  gatekeeperAssess: false

# A publish provider must be configured for electron-builder to emit
# `latest-mac.yml` (the electron-updater manifest, D10) alongside the DMG/ZIP on
# the release path. This block NEVER publishes on its own: `npm run package`
# (dir target) ignores it, and release.sh always passes `--publish never`.
# Actual uploading is WS4's job. Owner/repo name the intended GitHub Releases
# home so the generated manifest's URLs are correct from day one.
publish:
  provider: github
  owner: woody-design
  repo: sonata

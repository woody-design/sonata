<!doctype html>
<!-- data-term-scheme (NOT data-theme): the terminal owns its own scheme axis;
     it never carries a reading theme, so the preload's reading-stamp content
     fallback can't mistake it for a reading-themed document. The static sonata
     stamp keeps the pre-boot frame on the default palette until terminal.ts
     applies the persisted settings. -->
<html lang="en" data-term-scheme="sonata">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src allows 'unsafe-inline': the terminal window hosts xterm (from
         a later slice), which injects a <style> element (xterm.js #4445) that a
         strict style-src blocks. Mirrors the main window; script-src stays
         'self' (the load-bearing one). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonata CLI</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/terminal.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="duet">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src allows 'unsafe-inline': the terminal window hosts xterm (from
         a later slice), which injects a <style> element (xterm.js #4445) that a
         strict style-src blocks. Mirrors the main window; script-src stays
         'self' (the load-bearing one). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duet Terminal</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/terminal.ts"></script>
  </body>
</html>

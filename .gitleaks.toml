# Sonata gitleaks configuration — consumed by the standing pre-push leak fence
# (app/scripts/leak-fence.sh) and any manual `gitleaks git` run.
#
# Extends gitleaks' full default ruleset (real secret detection stays intact).
# The single allowlist below neutralizes one adjudicated false-positive class:
# canonical UUIDs captured in test fixtures.
#
# Basis (WS2 slice S2 audit, 2026-07-19): a full-history gitleaks scan produced
# 410 findings, ALL rule `generic-api-key`, ALL under app/tests/fixtures/, and
# ALL canonical 8-4-4-4-12 UUIDs (turn / session / message identifiers captured
# in runtime-event fixtures and their derived goldens). A UUID carries no
# credential value; `generic-api-key` is gitleaks' known high-entropy
# false-positive rule. Without this allowlist the standing fence would block
# even a clean, already-audited push. Real credentials (sk-, ghp_, AKIA, xox,
# Bearer, …) are NOT UUID-shaped and remain fully detected.
#
# SCOPING (consolidation S1): the allowlist is narrowed on THREE axes joined by
# `condition = "AND"`, so it neutralizes only the adjudicated class and nothing
# else — the earlier regex-only form suppressed a UUID-shaped finding from ANY
# rule ANYWHERE (Heroku API keys, for one, ARE canonical UUIDs, so the broad
# form silently masked them):
#   * targetRules = generic-api-key  — the ONLY rule the 410 findings triggered
#     (verified empirically, S1); a UUID caught by any other rule stays reported.
#   * paths = app/tests/fixtures/.*  — the only tree the false positives live in;
#     a generic-api-key UUID OUTSIDE the fixtures tree stays reported.
#   * regexes = the canonical UUID shape (matched against the flagged secret) —
#     a non-UUID generic-api-key hit in fixtures stays reported.
# Empirically (S1) this still reports 0 leaks over full history, yet a planted
# Heroku key and an out-of-fixtures generic-api-key UUID are both caught.

[extend]
useDefault = true

[[allowlists]]
description = "Canonical UUIDs in app/tests/fixtures/ flagged by generic-api-key are session/turn/message identifiers, not secrets (WS2 S2: 410/410 findings; S1: narrowed to that rule+path+shape)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''app/tests/fixtures/.*''']
# Match against the flagged secret text; a full UUID anywhere in the match is
# specific enough that no real credential is masked.
regexTarget = "match"
regexes = [
  '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
]
